<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft ambient drop shadow -->
    <radialGradient id="goldChestDropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#451a03" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Lid Gradient (Golden Amber / Warm Trailblazer) -->
    <linearGradient id="goldLidTopGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Lid Rim Front Left -->
    <linearGradient id="goldLidRimLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Lid Rim Front Right (Darker shadow) -->
    <linearGradient id="goldLidRimRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Box Body Front Left Face -->
    <linearGradient id="goldBodyLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Box Body Front Right Face (In deep shadow) -->
    <linearGradient id="goldBodyRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Bright Platinum/Gold Trim Gradients -->
    <linearGradient id="goldTrimHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <linearGradient id="goldTrimShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Emblem Gold Gradient -->
    <linearGradient id="goldEmblem" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef9c3"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Central Gem/Lock Jewel Gradient (Ruby / Fiery Star) -->
    <radialGradient id="goldLockGemGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f87171"/>
      <stop offset="65%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="64" cy="106" rx="46" ry="15" fill="url(#goldChestDropShadow)"/>

  <!-- ==================== BOX BODY ==================== -->
  <!-- Left Face Body -->
  <path d="M19 46 L59 70 L59 104 L24 81 Z" fill="url(#goldBodyLeftGrad)"/>
  <!-- Right Face Body -->
  <path d="M59 70 L104 43 L99 76 L59 104 Z" fill="url(#goldBodyRightGrad)"/>

  <!-- Vertical Gold Strips on Body -->
  <path d="M33 54 L37 56.5 L40 90 L36 88 Z" fill="url(#goldTrimHighlight)" opacity="0.95"/>
  <path d="M82 56 L86 53.5 L83 87 L79 90 Z" fill="url(#goldTrimShadow)" opacity="0.9"/>

  <!-- Bottom Rim Horizontal Gold Trim -->
  <path d="M23 79 L59 102 L59 105 L23 83 Z" fill="url(#goldTrimHighlight)"/>
  <path d="M59 102 L100 75 L100 78 L59 105 Z" fill="url(#goldTrimShadow)"/>

  <!-- Bottom Corner Brackets -->
  <path d="M21 76 L28 80.5 L28 85 L22 83.5 Z" fill="url(#goldTrimHighlight)"/>
  <path d="M22 83.5 L27 86.5 L26 89 L20 86 Z" fill="url(#goldTrimShadow)"/>

  <path d="M53 96 L59 100 L65 96 L65 102 L59 106 L53 102 Z" fill="url(#goldTrimHighlight)"/>
  <path d="M59 100 L65 96 L65 102 L59 106 Z" fill="url(#goldTrimShadow)"/>

  <path d="M94 77 L100 73.5 L101 78 L95 82 Z" fill="url(#goldTrimShadow)"/>

  <!-- ==================== BOX LID ==================== -->
  <path d="M14 41 L58 67 L58 73 L14 47 Z" fill="url(#goldLidRimLeft)"/>
  <path d="M58 67 L109 37 L109 43 L58 73 Z" fill="url(#goldLidRimRight)"/>

  <!-- Lid Bottom Edge Gold Band -->
  <path d="M14 45 L58 71 L58 73.5 L14 47.5 Z" fill="url(#goldTrimHighlight)"/>
  <path d="M58 71 L109 41 L109 43.5 L58 73.5 Z" fill="url(#goldTrimShadow)"/>

  <!-- Lid Top Surface -->
  <path d="M14 41 L61 17 L109 37 L58 67 Z" fill="url(#goldLidTopGrad)"/>

  <!-- Top Lid Border Inset Lines -->
  <path d="M19 41.5 L61 21 L103 38 L58 63 Z" fill="none" stroke="#78350f" stroke-width="1.2" opacity="0.6"/>

  <!-- Vertical Ribs on Lid Rim -->
  <path d="M30 50.5 L34 53 L34 58 L30 55.5 Z" fill="url(#goldTrimHighlight)"/>
  <path d="M88 49 L92 46.5 L92 51.5 L88 54 Z" fill="url(#goldTrimShadow)"/>

  <!-- ==================== LID GOLD CORNERS ==================== -->
  <path d="M55 18 L61 15 L67 18.5 L65 22 L61 20 L57 22 Z" fill="url(#goldTrimHighlight)"/>
  <path d="M13 39 L22 36 L21 42 L17 41 L18 48 L13 45 Z" fill="url(#goldTrimHighlight)"/>
  <path d="M110 35 L101 32 L101 38 L105 38 L104 45 L110 42 Z" fill="url(#goldTrimShadow)"/>

  <path d="M52 61 L58 57 L64 61 L62 67 L58 65 L54 67 Z" fill="url(#goldTrimHighlight)"/>
  <path d="M58 57 L64 61 L62 67 L58 65 Z" fill="url(#goldTrimShadow)"/>

  <!-- ==================== TOP LID FLOWER/CLOUD EMBLEM ==================== -->
  <path d="M58 26 C63 24 70 27 72 31 C76 31 80 34 79 38 C80 42 77 46 72 47 C70 51 63 53 58 51 C53 53 46 51 44 47 C39 46 36 42 37 38 C36 34 40 31 44 31 C46 27 53 24 58 26 Z" 
        fill="#78350f" opacity="0.6"/>

  <path d="M58 27 C62.5 25 69 28 71 32 C75 32 78.5 35 77.5 39 C78.5 42.5 75.5 46 71 47 C69 50.5 62.5 52 58 50 C53.5 52 47 50.5 45 47 C40.5 46 37.5 42.5 38.5 39 C37.5 35 41 32 45 32 C47 28 53.5 25 58 27 Z" 
        fill="url(#goldEmblem)"/>

  <path d="M58 31 C61 29.5 65.5 31.5 67 34.5 C69.5 34.5 72 36.5 71.5 39 C72 41.5 70 44 67 44.5 C65.5 47 61 48 58 46.5 C55 48 50.5 47 49 44.5 C46 44 44 41.5 44.5 39 C44 36.5 46.5 34.5 49 34.5 C50.5 31.5 55 29.5 58 31 Z" 
        fill="#f59e0b"/>

  <circle cx="58" cy="39" r="4.5" fill="url(#goldEmblem)"/>
  <circle cx="58" cy="39" r="2.2" fill="#78350f"/>

  <circle cx="40" cy="35" r="1.8" fill="url(#goldTrimHighlight)"/>
  <circle cx="76" cy="35" r="1.8" fill="url(#goldTrimHighlight)"/>
  <path d="M48 27 C46 25 43 26 42 28 C41 30 43 32 45 31" fill="none" stroke="url(#goldTrimHighlight)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M68 27 C70 25 73 26 74 28 C75 30 73 32 71 31" fill="none" stroke="url(#goldTrimHighlight)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ==================== FRONT LOCK & HASP ==================== -->
  <path d="M51 61 L65 61 L67 71 L58 79 L49 71 Z" fill="#78350f" opacity="0.7"/>
  <path d="M52 62 L64 62 L66 70.5 L58 78 L50 70.5 Z" fill="url(#goldTrimHighlight)"/>
  <path d="M58 62 L64 62 L66 70.5 L58 78 Z" fill="url(#goldTrimShadow)" opacity="0.6"/>

  <path d="M54 64.5 L62 64.5 L63.5 70 L58 75 L52.5 70 Z" fill="#78350f" opacity="0.8"/>

  <polygon points="58,66 61.8,69.5 58,73 54.2,69.5" fill="url(#goldLockGemGrad)"/>
  <polygon points="58,66 61.8,69.5 58,69.5" fill="#fef2f2" opacity="0.8"/>

  <circle cx="57" cy="68" r="0.8" fill="#ffffff"/>
  <circle cx="21" cy="40" r="0.9" fill="#ffffff" opacity="0.8"/>
  <circle cx="58" cy="18" r="0.9" fill="#ffffff" opacity="0.8"/>
  <circle cx="58" cy="101" r="0.9" fill="#ffffff" opacity="0.8"/>
</svg>

